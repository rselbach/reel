name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Validate repository
        run: just validate

      - name: Test with coverage
        run: just test-coverage

      - name: Import certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY_OVERRIDE: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          CERTIFICATE_P12_PATH="$RUNNER_TEMP/certificate.p12"
          trap 'shred -u "$CERTIFICATE_P12_PATH" 2>/dev/null || rm -f "$CERTIFICATE_P12_PATH"' EXIT

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_P12_PATH"
          chmod 600 "$CERTIFICATE_P12_PATH"
          security import "$CERTIFICATE_P12_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if [[ -n "${SIGNING_IDENTITY_OVERRIDE:-}" ]]; then
            SIGNING_IDENTITY="$SIGNING_IDENTITY_OVERRIDE"
          else
            IDENTITY_OUTPUT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
            SIGNING_IDENTITY="$(awk -F'"' '/"Developer ID Application:/ { print $2; exit }' <<< "$IDENTITY_OUTPUT")"
            if [[ -z "$SIGNING_IDENTITY" ]]; then
              SIGNING_IDENTITY="$(awk -F'"' '/^[[:space:]]*[0-9]+\)[[:space:]]+[0-9A-Fa-f]{40}[[:space:]]+"/ { print $2; exit }' <<< "$IDENTITY_OUTPUT")"
            fi
          fi

          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "Error: no codesigning identity found in $KEYCHAIN_PATH (and secrets.SIGNING_IDENTITY is unset)" >&2
            exit 1
          fi

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Build and sign
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION="$VERSION" just sign

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARIZE_PROFILE: NOTARIZE_PROFILE
        run: |
          set -euo pipefail

          xcrun notarytool store-credentials "$NOTARIZE_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

          trap 'rm -f .build/Reel.zip' EXIT
          ditto -c -k --keepParent .build/Reel.app .build/Reel.zip
          ./scripts/release/notarize-and-staple.sh .build/Reel.app .build/Reel.zip

      - name: Create, sign, and notarize DMG
        env:
          NOTARIZE_PROFILE: NOTARIZE_PROFILE
        run: |
          set -euo pipefail
          just _dmg-only _sign-dmg _notarize-dmg

      - name: Sign update for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SIGN_UPDATE=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          SIGNATURE="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" .build/Reel.dmg --ed-key-file -)"
          {
            echo "SPARKLE_SIGNATURE<<EOF"
            printf '%s\n' "$SIGNATURE"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Sparkle signature generated"

      - name: Generate appcast.xml
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          ./scripts/release/generate-appcast.sh "$VERSION" "$SPARKLE_SIGNATURE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Generate changelog
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            git log --pretty=format:"- %s" "$PREV_TAG"..HEAD > release_notes.md
          else
            git log --pretty=format:"- %s" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/Reel.dmg
          body_path: release_notes.md

  deploy-appcast:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
